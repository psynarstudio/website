# Pages CMS 後台設定（https://app.pagescms.org，用 GitHub 帳號登入）
# 在後台存檔 = commit 到 GitHub，GitHub Actions 會自動重新建置網站。

media:
  input: images/uploads
  output: /images/uploads

content:
  - name: observations
    label: 城市觀察
    type: collection
    path: observations
    format: yaml-frontmatter
    subfolders: true
    exclude: [index.qmd]
    filename: "{year}-{month}-{fields.slug}.qmd"
    view:
      primary: title
      fields: [title, date, draft]
      sort: date
      order: desc
    fields: &post-fields
      - name: title
        label: 標題
        type: string
        required: true
      - name: slug
        label: 網址代稱（英文小寫與連字號，例如 first-lost）
        type: string
        required: true
      - name: description
        label: 摘要（顯示在文章列表）
        type: text
      - name: date
        label: 發布日期
        type: date
        required: true
      - name: categories
        label: 分類標籤
        type: string
        list: true
      - name: steps
        label: 方法標籤（這篇用到哪幾步）
        type: select
        options:
          multiple: true
          values: [觀察, 理解, 分析, 設計]
      - name: image
        label: 封面圖
        type: image
      - name: draft
        label: 草稿（勾選後不會出現在網站上）
        type: boolean
        default: false
      - name: body
        label: 內文（Markdown）
        type: code
        options:
          language: markdown

  - name: analysis
    label: 城市分析
    type: collection
    path: analysis
    format: yaml-frontmatter
    subfolders: true
    exclude: [index.qmd]
    filename: "{year}-{month}-{fields.slug}.qmd"
    view:
      primary: title
      fields: [title, date, draft]
      sort: date
      order: desc
    fields: *post-fields

  - name: about
    label: 關於
    type: file
    path: about.qmd
    format: yaml-frontmatter
    fields: &page-fields
      - name: title
        label: 頁面標題
        type: string
      - name: body
        label: 內文（Markdown）
        type: code
        options:
          language: markdown

  - name: works
    label: 作品與工具
    type: file
    path: works.qmd
    format: yaml-frontmatter
    fields: *page-fields

  - name: collaborate
    label: 合作
    type: file
    path: collaborate.qmd
    format: yaml-frontmatter
    fields: *page-fields
